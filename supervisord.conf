[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true

[program:smbd]
command=/usr/sbin/smbd -D
autostart=true
autorestart=true
stderr_logfile=/var/log/samba/smbd.log
stdout_logfile=/var/log/samba/smbd.log

[program:node]
command=npm start
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/node.log
stdout_logfile=/var/log/node.log
user=node
environment=NODE_ENV=production
