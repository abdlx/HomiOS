name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # node:sqlite (lib/db.ts) needs >= 22.13
          node-version: '22.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          HOMIOS_DISABLE_PWA: 'true'

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install
        run: npm ci

      # Fails the build on any high/critical advisory in runtime dependencies.
      # Moderates are reported but non-blocking — see `npm run audit:ci`.
      - name: Audit runtime dependencies
        run: npm run audit:ci

      - name: Report all advisories (non-blocking)
        if: always()
        run: npm audit --omit=dev || true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
